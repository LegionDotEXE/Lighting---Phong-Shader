<!-- Index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Virtual World</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 10px; left: 10px;
      color: white; font-family: monospace; font-size: 14px;
      pointer-events: none; z-index: 10;
    }
    #perf {
      position: fixed; top: 10px; right: 10px;
      color: lime; font-family: monospace; font-size: 14px;
      pointer-events: none; z-index: 10;
    }
    #story {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: gold; font-family: monospace; font-size: 28px;
      pointer-events: none; z-index: 10;
      text-shadow: 2px 2px 4px black;
    }
    #controls {
      position: fixed; bottom: 10px; left: 10px;
      color: #aaa; font-family: monospace; font-size: 12px;
      pointer-events: none; z-index: 10;
    }
        #lightPanel {
      position: fixed; top: 40px; right: 10px;
      background: rgba(0,0,0,0.7);
      color: #ccc; font-family: monospace; font-size: 12px;
      padding: 10px; border-radius: 6px; z-index: 20;
      width: 220px;
    }
    #lightPanel button {
      margin: 2px; padding: 4px 8px; font-size: 11px;
      cursor: pointer; font-family: monospace;
    }
    #lightPanel label {
      display: block; margin-top: 6px;
    }
    #lightPanel input[type=range] {
      width: 100%;
    }
  </style>
</head>
<body>
  <canvas id="webgl" width="800" height="600"></canvas>

  <div id="hud"></div>
  <div id="perf"></div>
  <div id="story">Find the Lost Baby Goat!</div>
  <div id="controls">
    WASD: Move | Q/E: Rotate | Mouse: Look | Click: Add Block | Shift+Click: Remove Block
  </div>

  <div id="lightPanel">
    <b>Light Controls</b><br>
    <button id="btnLight">Light On/Off</button>
    <button id="btnNormal">Normals</button><br>
    <button id="btnSpot">Spot On/Off</button>
    <button id="btnAnimate">Animate</button>
    

    <label>Light X
      <input type="range" id="lightX" min="-10" max="10" step="0.1" value="0">
    </label>
    <label>Light Y
      <input type="range" id="lightY" min="0" max="15" step="0.1" value="5">
    </label>
    <label>Light Z
      <input type="range" id="lightZ" min="-10" max="10" step="0.1" value="0">
    </label>

    <label>Light R
      <input type="range" id="lightR" min="0" max="255" value="255">
    </label>
    <label>Light G
      <input type="range" id="lightG" min="0" max="255" value="255">
    </label>
    <label>Light B
      <input type="range" id="lightB" min="0" max="255" value="255">
    </label>
  </div>

  <script src="lib/cuon-utils.js"></script>
  <script src="lib/cuon-matrix-cse160.js"></script>

  <script src="Camera.js"></script>
  <script src="Cube.js"></script>
  <script src="Cone.js"></script>
  <script src="Sphere.js"></script>
  <script src="Model.js"></script>
  <script src="Goat.js"></script>
  <script src="Map.js"></script>
  <script src="World.js"></script>
</body>
</html>
